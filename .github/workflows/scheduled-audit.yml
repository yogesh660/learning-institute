name: Scheduled academy audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run backend tests
        run: python -m unittest discover -s tests -q
      - name: Scan for committed secrets
        run: python scripts/academy/secret-scan.py .
      - name: Build and validate curriculum evidence
        run: |
          node scripts/build.js
          node scripts/academy/curriculum-audit.js /tmp/curriculum-audit.json --strict
          node scripts/academy/qa-report.js /tmp/qa-report.json --strict
      - name: Generate health snapshot
        run: python -m orchestrator.main health --output academy-health.json
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-academy-audit
          path: academy-health.json
