# Builds every page from content/ and publishes the site to GitHub Pages.
# Served at https://yogesh660.github.io/ml-model-zoo/
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build pages
        run: node scripts/build.js
      - name: Check every local link resolves
        run: |
          python3 - <<'PY'
          import re, os, glob, sys
          bad = []
          for f in ["index.html"] + glob.glob("models/*/index.html") + glob.glob("concepts/*/index.html"):
              base = os.path.dirname(f)
              for u in re.findall(r'(?:href|src)="([^"#:?]+)(?:[?#][^"]*)?"', open(f).read()):
                  # root-relative links (/work/, /featured-games/) belong to the user site, not this repo
                  if u.startswith(("http", "mailto", "/")):
                      continue
                  p = os.path.normpath(os.path.join(base, u))
                  if u.endswith("/"):
                      p = os.path.join(p, "index.html")
                  if not os.path.exists(p):
                      bad.append(f"{f} -> {u}")
          print("\n".join(bad) or "all links ok")
          sys.exit(1 if bad else 0)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

