name: Academy status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate evidence reports
        run: |
          python -m unittest discover -s tests -q
          python -m orchestrator.main health --output /tmp/backend-health.json
          python scripts/academy/secret-scan.py .
          ACADEMY_EVIDENCE_DIR=/tmp node scripts/academy/status.js /tmp/academy-status.json
      - name: Upload status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: academy-status
          path: |
            /tmp/backend-health.json
            /tmp/academy-status.json

