name: Academy status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate evidence reports
        run: |
          node scripts/academy/curriculum-audit.js /tmp/phase-2-curriculum-audit.json --strict
          node scripts/academy/qa-report.js /tmp/phase-3-qa-report.json --strict
          node scripts/academy/analytics-report.js /tmp/phase-5-analytics-report.json
          ACADEMY_EVIDENCE_DIR=/tmp node scripts/academy/status.js /tmp/phase-6-status.json
      - name: Upload status snapshot
        uses: actions/upload-artifact@v4
        with:
          name: academy-status
          path: /tmp/phase-*.json

