name: Academy backend validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Scan for committed secret patterns
        run: python scripts/academy/secret-scan.py .
      - name: Generate backend health report
        run: python -m orchestrator.main health --output backend-health.json
      - name: Verify audit chain
        run: python -m orchestrator.main audit-verify --audit /tmp/academy-audit.jsonl --output audit-verification.json
      - name: Generate read-only curriculum review
        shell: bash
        run: |
          task_json=$(python -m orchestrator.main create --store /tmp/academy-tasks.json --subject ci-agent --role agent --dedupe-key "${GITHUB_RUN_ID}:curriculum-review")
          task_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$task_json")
          python -m orchestrator.main run "$task_id" --store /tmp/academy-tasks.json --repo-root . --subject ci-agent --role agent --output curriculum-review.json
      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: academy-backend-health
          path: |
            backend-health.json
            audit-verification.json
            curriculum-review.json
