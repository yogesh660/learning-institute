name: Academy backend validation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Generate backend health report
        run: python -m orchestrator.main health --output backend-health.json
      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: academy-backend-health
          path: backend-health.json
