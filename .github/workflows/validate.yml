name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate foundation tests
        run: python -m unittest discover -s tests -v
      - name: Scan committed secrets
        run: python scripts/academy/secret-scan.py .
      - name: Generate backend health report
        run: python -m orchestrator.main health --output backend-health.json
      - name: Verify audit chain
        run: python -m orchestrator.main audit-verify --audit /tmp/academy-audit.jsonl --output audit-verification.json
      - name: Run offline proposal gate
        run: python scripts/academy/synthetic-proposal.py --output synthetic-proposal.json
      - name: Upload backend evidence
        uses: actions/upload-artifact@v4
        with:
          name: academy-backend-validation
          path: |
            backend-health.json
            audit-verification.json
            synthetic-proposal.json

